<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>鍼灸体調確認表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 1画面1テーマのタブレット向け問診。受付 → 健康のこと → お悩み → 体質の質問6画面 → きっかけ → 施術者の確認 → 患者さん向けの結果 */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #23302d;
  --muted: #5d6b67;
  --line: #d8dfdb;
  --accent: #7a3e62;
  --accent-soft: #f3e7ee;
  --on-accent: #ffffff;
  --staff: #2f5d6e;
  --staff-soft: #e4eef1;
  --warn: #a5552a;
  --warn-soft: #fbeee5;
  /* 8つの証の色 */
  --A: #b7791f; --B: #2f6aa8; --C: #b8506a; --D: #2b8a85; --E: #4f8a3c; --F: #6b56a8; --G: #7d6b45; --H: #c4472f; --K: #44546a;
  /* iPad・Mac は内蔵のヒラギノを先に使い、Web フォントを読み込まない（日本語の Web フォントは数百ファイルに分かれていて、iPad では重くなるため） */
  --font-display: "Hiragino Maru Gothic ProN", "Zen Maru Gothic", "Yu Gothic", sans-serif;
  --font-body: "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic", "Meiryo", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171d1c; --surface: #212927; --ink: #e8eeeb; --muted: #a3b0ac; --line: #35403d;
    --accent: #d99abd; --accent-soft: #3a2a33; --on-accent: #22161d;
    --staff: #8cc4d6; --staff-soft: #22343a;
    --warn: #f0a77c; --warn-soft: #3a2a22;
    --A: #e0a85a; --B: #7eaee6; --C: #e88aa0; --D: #6cc7c0; --E: #8fc77a; --F: #a996e0; --G: #c4b083; --H: #f08a70; --K: #a8b6c8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171d1c; --surface: #212927; --ink: #e8eeeb; --muted: #a3b0ac; --line: #35403d;
  --accent: #d99abd; --accent-soft: #3a2a33; --on-accent: #22161d;
  --staff: #8cc4d6; --staff-soft: #22343a;
  --warn: #f0a77c; --warn-soft: #3a2a22;
  --A: #e0a85a; --B: #7eaee6; --C: #e88aa0; --D: #6cc7c0; --E: #8fc77a; --F: #a996e0; --G: #c4b083; --H: #f08a70; --K: #a8b6c8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* すばやく続けてタップしても、画面が拡大されないようにする */
button, a, input, textarea, summary { touch-action: manipulation; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 120px; display: flex; flex-direction: column; gap: 20px; }
.stack { display: flex; flex-direction: column; gap: 20px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; margin: 0; letter-spacing: .04em; }
.brand .step { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.progress { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.progress span { height: 6px; border-radius: 3px; background: var(--line); }
.progress span.done { background: var(--accent); }

h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1.4; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; line-height: 1.4; margin: 0; }
.lead { color: var(--muted); margin: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel p { margin: 0; }

/* 入力 */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .label { font-weight: 700; font-size: .95rem; }
.field .opt { color: var(--muted); font-weight: 400; font-size: .85rem; margin-left: 6px; }
input[type="text"], input[type="date"], input[type="number"], textarea {
  font: inherit; font-size: 1.02rem; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; min-height: 52px;
}
textarea { line-height: 1.6; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: .98rem; padding: 10px 16px; min-height: 48px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.staff-screen .chip[aria-pressed="true"] { background: var(--staff); border-color: var(--staff); }
.chips.big .chip { font-size: 1.05rem; padding: 12px 20px; min-height: 56px; }
.group-h { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }

/* 設問 */
.howto { background: var(--accent-soft); border-radius: var(--radius); padding: 14px 18px; margin: 0; font-size: .95rem; }
.qs { display: flex; flex-direction: column; gap: 10px; }
.q {
  display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
  font: inherit; font-size: 1.08rem; line-height: 1.55; color: var(--ink);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius);
  padding: 14px 18px; min-height: 68px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.q .box {
  flex: none; width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--line);
  display: grid; place-items: center; transition: background .15s, border-color .15s;
}
.q .box svg { width: 20px; height: 20px; opacity: 0; transition: opacity .15s; }
.q[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.q[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.q[aria-pressed="true"] .box svg { opacity: 1; }
.q .txt { min-width: 0; }
.count-note { color: var(--muted); font-size: .9rem; text-align: right; font-variant-numeric: tabular-nums; margin: 0; }

/* 下のナビ */
nav.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
nav.bar .in { max-width: 760px; margin: 0 auto; display: flex; gap: 12px; }
.btn {
  font: inherit; font-weight: 700; font-size: 1.05rem; min-height: 56px; padding: 0 22px;
  border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
}
.btn.primary { flex: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: .4; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* 施術者の確認画面 */
.staff-banner { background: var(--staff-soft); color: var(--ink); border-left: 5px solid var(--staff); border-radius: 0 var(--radius) var(--radius) 0; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; }
.staff-banner strong { color: var(--staff); letter-spacing: .06em; font-size: .85rem; }
.staff-screen .eyebrow { color: var(--staff); }
.warn { background: var(--warn-soft); border-left: 5px solid var(--warn); border-radius: 0 var(--radius) var(--radius) 0; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
.warn strong { color: var(--warn); letter-spacing: .06em; font-size: .85rem; }
.warn ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; font-size: .95rem; }
.kv { display: grid; grid-template-columns: 8em 1fr; gap: 6px 12px; font-size: .95rem; margin: 0; }
.kv dt { color: var(--muted); font-weight: 700; }
.kv dd { margin: 0; min-width: 0; }
@media (max-width: 520px) { .kv { grid-template-columns: 1fr; } .kv dd { margin-bottom: 6px; } }
.hakko { display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: center; }
@media (max-width: 560px) { .hakko { grid-template-columns: 1fr; justify-items: center; } }
.hakko svg { width: 100%; max-width: 220px; height: auto; display: block; }
.hakko svg text { font-family: var(--font-body); }

/* 結果 */
.result-head { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: .8rem; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.sho-card { border: 1.5px solid var(--line); border-top: 6px solid var(--tc); border-radius: var(--radius); background: var(--surface); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.sho-card .role { font-size: .8rem; font-weight: 700; color: var(--tc); letter-spacing: .08em; }
.sho-card .term { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1.3; }
.sho-card .yomi { color: var(--muted); font-size: .9rem; margin-top: -6px; }
.sho-card p { margin: 0; }
.strength { background: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: .95rem; }
.strength b { color: var(--tc); }
.sub-line { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; }
.sub-line .tag { font-size: .78rem; font-weight: 700; color: var(--tc); letter-spacing: .08em; }
.sub-line .t { font-weight: 700; }

.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 6.5em 1fr 3.2em; gap: 12px; align-items: center; font-size: .92rem; }
.bar-row .lbl { min-width: 0; }
.bar-row .track { height: 14px; background: var(--bg); border-radius: 7px; overflow: hidden; border: 1px solid var(--line); }
.bar-row .fill { height: 100%; background: var(--tc); border-radius: 7px; }
.bar-row .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }

/* からだのバランス（患者さん向けの目盛り） */
.meters { display: flex; flex-direction: column; gap: 16px; }
.meter { display: flex; flex-direction: column; gap: 6px; }
.meter .ends { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; font-size: .9rem; font-weight: 700; align-items: baseline; }
.meter .ends span:last-child { text-align: right; }
.meter .mid { color: var(--muted); font-weight: 400; font-size: .8rem; }
.mtrack { position: relative; height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--l), var(--line) 50%, var(--r)); }
.mtrack::after { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 2px; background: var(--muted); opacity: .5; }
.mtrack .dot { position: absolute; top: 50%; width: 26px; height: 26px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--surface); border: 5px solid var(--ink); z-index: 1; }

.plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.plan-item { background: var(--bg); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.plan-item .k { font-size: .8rem; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.plan-item .v { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; }
.pre { white-space: pre-wrap; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tags span { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .92rem; background: var(--bg); }
.tags span.top { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.goal { font-family: var(--font-display); font-size: 1.12rem; line-height: 1.85; }

/* 通院の流れ */
.stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; counter-reset: st; }
@media (max-width: 620px) { .stages { grid-template-columns: 1fr; } }
.stage { border: 1px solid var(--line); border-top: 6px solid var(--accent); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.stage:nth-child(2) { border-top-color: color-mix(in srgb, var(--accent) 65%, var(--surface)); }
.stage:nth-child(3) { border-top-color: color-mix(in srgb, var(--accent) 35%, var(--surface)); }
.stage .when { font-size: .78rem; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.stage b { font-family: var(--font-display); font-size: 1.12rem; }
.stage p { font-size: .92rem; line-height: 1.65; }
.future { background: var(--accent-soft); border-radius: var(--radius); padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; text-align: center; }
.future .v { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; line-height: 1.6; text-wrap: balance; }

.advice { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.adv { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.adv .h { font-weight: 700; font-size: .95rem; display: flex; align-items: center; gap: 8px; }
.adv .h::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--hc, var(--accent)); flex: none; }
.adv ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; font-size: .95rem; }
.adv p { font-size: .95rem; }
.comment { font-family: var(--font-display); font-size: 1.05rem; line-height: 1.8; border-left: 4px solid var(--accent); padding-left: 14px; }
.believe { background: var(--accent-soft); border-radius: var(--radius); padding: 22px 24px; display: flex; flex-direction: column; gap: 10px; }
.believe p { margin: 0; font-family: var(--font-display); font-size: 1.12rem; line-height: 1.95; }
.believe .last { font-weight: 700; }
.notice { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 12px 16px; border-radius: 0 10px 10px 0; font-size: .95rem; margin: 0; }
.small { font-size: .85rem; color: var(--muted); margin: 0; }

.staff summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; }
.staff pre, .staff-pre {
  white-space: pre-wrap; word-break: break-word; font-family: var(--font-body); font-size: .92rem;
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 0;
}
.copy-row, .out-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.copied { color: var(--E); font-weight: 700; font-size: .9rem; }

/* 次の方へ の確認 */
.confirm { position: fixed; inset: 0; z-index: 20; background: rgba(20, 26, 25, .45); display: grid; place-items: center; padding: 16px; }
.confirm .box2 { background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: 24px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 16px; }
.confirm .acts { display: flex; gap: 12px; }
.confirm .acts .btn { flex: 1; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* 印刷: 患者さん向けの結果だけを、明るい配色で A4 に出す */
@media print {
  :root:root:root {
    --bg: #ffffff; --surface: #ffffff; --ink: #23302d; --muted: #5d6b67; --line: #d8dfdb;
    --accent: #7a3e62; --accent-soft: #f3e7ee; --on-accent: #ffffff;
    --A: #b7791f; --B: #2f6aa8; --C: #b8506a; --D: #2b8a85; --E: #4f8a3c; --F: #6b56a8; --G: #7d6b45; --H: #c4472f; --K: #44546a;
    color-scheme: light;
  }
  @page { size: A4; margin: 12mm; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-size: 11pt; padding: 0; }
  body::before, header.top, nav.bar, .no-print, details.staff, .confirm { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  /* iPad の Safari は flex の中身をページの境目で切ってしまう（文字が上下に分かれる）。印刷では flex をやめて、ふつうの縦の並びにする */
  .wrap, .stack, .panel, .sho-card, .believe, .future, .result-head, .meters, .meter, .stage, .adv, .field { display: block; }
  .eyebrow, .role, .term, .yomi, .when, .stage b, .future .v, .field .label { display: block; }
  .wrap > * + *, .stack > * + * { margin-top: 14px; }
  .panel > * + *, .sho-card > * + *, .believe > * + *, .future > * + *, .stage > * + *, .adv > * + *, .field > * + *, .meters > * + *, .meter > * + * { margin-top: 8px; }
  .sho-card .yomi { margin-top: 2px; }
  .panel, .sho-card, .stage, .adv, .believe, .future, .notice, .field { break-inside: avoid; page-break-inside: avoid; }
  p { orphans: 3; widows: 3; }
  /* iPad は大きな枠をページの境目で分けることがあり、外枠の線が途中で切れて見える。印刷では外枠をやめて、上の区切り線だけにする */
  .panel { border: none; border-top: 1.5px solid var(--line); border-radius: 0; padding: 12px 0 0; }
  .eyebrow, h2, h3 { break-after: avoid; page-break-after: avoid; }
  .mtrack { margin-bottom: 14px; }
  .stages { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .advice { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>鍼灸体調確認表</h1>
      <span class="step" id="stepLabel"></span>
    </div>
    <div class="progress" id="progress" aria-hidden="true"></div>
  </header>
  <main id="screen"></main>
</div>

<nav class="bar" aria-label="ページ移動">
  <div class="in">
    <button class="btn" id="backBtn" type="button">もどる</button>
    <button class="btn primary" id="nextBtn" type="button">はじめる</button>
  </div>
</nav>

<div class="confirm" id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="box2">
    <h2 id="confirmTitle" style="font-size:1.25rem">入力内容を消して、次の方へ進みますか？</h2>
    <p class="small">この確認表はデータを保存しません。消すと元に戻せないので、必要な内容はカルテに書き写してから進んでください。</p>
    <div class="acts">
      <button class="btn" id="cancelReset" type="button">やめる</button>
      <button class="btn primary" id="doReset" type="button">消して次の方へ</button>
    </div>
  </div>
</div>

<script>
const CHECK_SVG = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10.5l4 4 8-9" stroke="var(--on-accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// 8つの証。A〜D は「足りない（虚）」、E〜H は「詰まっている（実）」。各証6問ずつ、下の SECTIONS に散らしてある
const TYPES = {
  A: { term: "気虚", termSub: "脾気虚", yomi: "ききょ／ひききょ", nick: "おつかれ・エネルギー不足さん", group: "虚",
    state: "からだを動かすエネルギー「気」が足りなくなっている状態です。気は主に胃腸（脾）の働きで食べたものからつくられるため、胃腸が疲れると気も不足しやすくなります。疲れやすさ、だるさ、食欲のムラ、風邪のひきやすさとして表れやすくなります。",
    strength: "まわりに気を配れて、コツコツと続けられる力があります。",

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const termFull = (t) => t.termSub ? `${t.term}（${t.termSub}）` : t.term;
const pct = (v) => `${Math.round(v * 100)}%`;
const pregnant = () => state.mens === "妊娠中";

const symList = () => [...state.syms].sort((a, b) => (b === state.top) - (a === state.top));

function counts() {
  const n = Object.fromEntries(KEYS.map((k) => [k, 0]));
  SECTIONS.forEach((s, i) => s.qs.forEach((q, j) => { if (state.checks.has(`${i}-${j}`)) n[q.k]++; }));
  return KEYS.map((k) => ({ ...TYPES[k], key: k, n: n[k] }));
}

// 八綱の目安。虚＝A〜D、実＝E〜H、寒＝陽虚、熱＝陰虚・実熱。それぞれ質問数で割って割合にする
function axes() {
  const c = Object.fromEntries(counts().map((t) => [t.key, t.n]));
  const kyo = (c.A + c.B + c.C + c.D) / (QPER * 4), jitsu = (c.E + c.F + c.G + c.H) / (QPER * 4);
  const cold = c.B / QPER, heat = (c.D + c.H) / (QPER * 2);
  return { kyo, jitsu, cold, heat, x: heat - cold, y: jitsu - kyo, yin: (kyo + cold) / 2, yang: (jitsu + heat) / 2, any: state.checks.size > 0 };
}
const lean = (a, b, la, lb) => Math.abs(a - b) < 0.15 ? "偏り小さめ" : a > b ? `${la}寄り` : `${lb}寄り`;

function judge() {
  const cs = counts();
  const max = Math.max(...cs.map((c) => c.n));
  if (max === 0) return { main: [], sub: [], cs };
  const main = cs.filter((c) => c.n === max);
  const rest = cs.filter((c) => c.n < max && c.n > 0);
  const second = rest.length ? Math.max(...rest.map((c) => c.n)) : 0;
  const sub = second ? rest.filter((c) => c.n === second) : [];
  return { main, sub, cs };
}

// 自動判定から施術者画面の初期値を決める。同数のときは先頭を選び、施術者が変えられる
function autoPick() {
  const { main, sub } = judge();
  state.main = main.length ? main[0].key : null;
  state.sub = main.length > 1 ? main[1].key : sub.length ? sub[0].key : null;
  fillPlan();
}

function fillPlan() {
  const m = state.main && TYPES[state.main], s = state.sub && TYPES[state.sub];
  const syms = symList();
  const lines = [];
  if (m) lines.push(`本治：${m.policy}`);
  if (s) lines.push(`あわせて${termFull(s)}に配慮：${s.policy}`);
  if (syms.length) lines.push(`標治：${syms.join("・")}に対して、局所と遠隔のツボで症状をやわらげる。`);
  if (pregnant()) lines.push(`妊娠中：刺激はごく軽く、${AVOID_PREG.join("・")}などへの刺激と腹部・腰仙部への強い刺激は避ける。`);
  state.policy = lines.join("\n");

  let pts = [...(m ? m.points : []), ...(s ? s.points.slice(0, 2) : []), ...syms.slice(0, 3).flatMap((n) => symBy(n).pts.slice(0, 2))];
  if (pregnant()) pts = pts.filter((p) => !AVOID_PREG.includes(p));
  state.points = [...new Set(pts)].join("、");

  const plain = [];
  if (m) plain.push(m.full);
  if (s) plain.push(`あわせて、${s.short}も大切にします。`);
  plain.push("そして、からだ全体のバランスを整えて、不調が出にくい土台をつくっていきます。");
  state.plain = plain.join("");

  const goal = [];
  if (syms.length) {
    goal.push(`いちばんのお悩みの「${syms[0]}」は、${symBy(syms[0]).goal}を目指します。`);
    if (syms.length > 1) goal.push(`あわせて、${syms.slice(1).join("・")}も一緒にみていきます。`);
    goal.push("つらさをやわらげるだけでなく、不調が出にくいからだの土台づくりを大切にします。");
  } else {
    goal.push("からだ全体のバランスを整え、不調が出にくいからだの土台づくりを目指します。");
  }
  state.goal = goal.join("");
  state.future = m ? m.future : "毎日を楽に過ごせるからだ";
}

function render(keepScroll) {
  const s = $("screen");
  const label = step === 0 ? "受付" : step === 1 ? "健康のこと" : step === 2 ? "お悩み"
    : step < CAUSE_STEP ? `体質の質問 ${step - Q0 + 1} / ${SECTIONS.length}` : step === CAUSE_STEP ? "きっかけ" : step === STAFF_STEP ? "施術者の確認" : "結果";
  $("stepLabel").textContent = label;
  $("progress").innerHTML = Array.from({ length: TOTAL }, (_, i) => `<span class="${i <= step ? "done" : ""}"></span>`).join("");
  $("backBtn").disabled = step === 0;
  $("nextBtn").textContent = step === 0 ? "はじめる" : step < CAUSE_STEP ? "次へ" : step === CAUSE_STEP ? "回答を終える" : step === STAFF_STEP ? "患者さん用の結果を表示" : "次の方へ";

  if (step === 0) s.innerHTML = intakeHTML();
  else if (step === 1) s.innerHTML = healthHTML();
  else if (step === 2) s.innerHTML = symptomHTML();
  else if (step < CAUSE_STEP) s.innerHTML = sectionHTML(step - Q0);
  else if (step === CAUSE_STEP) s.innerHTML = causeHTML();
  else if (step === STAFF_STEP) s.innerHTML = staffHTML();
  else s.innerHTML = resultHTML();
  bind();
  if (!keepScroll) window.scrollTo({ top: 0 });
}

// 八綱の図。横＝寒⇄熱、縦＝虚⇄実
function hakkoSVG(a) {
  const c = 110, r = 88, px = c + a.x * r, py = c - a.y * r;
  const t = (x, y, s, anchor = "middle", fill = "var(--muted)") => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="12" style="fill:${fill}">${s}</text>`;
  return `<svg viewBox="0 0 220 220" role="img" aria-label="虚実と寒熱の傾向を示す図">
    <rect x="${c - r}" y="${c - r}" width="${r * 2}" height="${r * 2}" rx="10" style="fill:var(--bg);stroke:var(--line)"/>
    <line x1="${c - r}" y1="${c}" x2="${c + r}" y2="${c}" style="stroke:var(--line);stroke-width:1.5"/>
    <line x1="${c}" y1="${c - r}" x2="${c}" y2="${c + r}" style="stroke:var(--line);stroke-width:1.5"/>
    ${t(c, 15, "実")}${t(c, 214, "虚")}${t(8, c + 4, "寒", "start")}${t(212, c + 4, "熱", "end")}
    ${t(c - r + 8, c - r + 18, "実寒", "start")}${t(c + r - 8, c - r + 18, "実熱（陽）", "end")}
    ${t(c - r + 8, c + r - 8, "虚寒（陰）", "start")}${t(c + r - 8, c + r - 8, "虚熱", "end")}
    ${a.any ? `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="9" style="fill:var(--staff);stroke:var(--surface);stroke-width:3"/>` : ""}
  </svg>`;
}

  if (state.mens === "産後・授乳中") L.push("産後・授乳中：体力の回復に合わせて、刺激量を少なめに。");
  if (state.med === "あり") L.push(`通院・服薬あり${state.medNote ? `（${state.medNote}）` : ""}：内容を確認する。`);
  if (state.exp === "はじめて") L.push("鍼灸ははじめて：細い鍼・少ない本数から。施術の流れを先に説明する。");
  const w = [...state.worry].filter((t) => t !== "特になし");

  return L;
}

      <p class="small">${esc(autoText)}。脈・舌・腹診・お話の内容とあわせて、下で証を決めてください。</p>
    </div>
    <div class="panel">
      <span class="eyebrow">八綱の目安</span>
      <div class="hakko">
        ${hakkoSVG(a)}
        <dl class="kv">
          <dt>虚実</dt><dd>虚 ${pct(a.kyo)}・実 ${pct(a.jitsu)} → ${lean(a.kyo, a.jitsu, "虚", "実")}</dd>
          <dt>寒熱</dt><dd>寒 ${pct(a.cold)}・熱 ${pct(a.heat)} → ${lean(a.cold, a.heat, "寒", "熱")}</dd>
          <dt>陰陽</dt><dd>${lean(a.yin, a.yang, "陰", "陽")}</dd>
          <dt>病因</dt><dd>${causes.length ? causes.map((c) => esc(c)).join("<br>") : "（選択なし）"}</dd>
        </dl>
      </div>
      <p class="small">表裏は問診だけでは判断しにくいため、急な発症・悪寒発熱の有無などを口頭で確認してください。</p>
    </div>
    <div class="panel">
      <div class="field">
        <span class="label" id="mainLbl">メインの証</span>
        <div class="chips" role="group" aria-labelledby="mainLbl">${KEYS.map((k) => chip("main", k, termFull(TYPES[k]))).join("")}</div>
      </div>
      <div class="field">
        <span class="label" id="subLbl">サブの証</span>
        <div class="chips" role="group" aria-labelledby="subLbl">${chip("sub", "", "なし")}${KEYS.map((k) => chip("sub", k, termFull(TYPES[k]))).join("")}</div>
      </div>
      <p class="small">証を変えると、下の施術方針・ツボ・患者さんへの説明・目的が書き直されます。</p>
    </div>
    <div class="panel">
      <span class="eyebrow">先生だけが見る内容（結果画面には出ません）</span>
      <div class="field">
        <label for="fPolicy">施術方針</label>
        <textarea id="fPolicy" rows="6">${esc(state.policy)}</textarea>
      </div>
      <div class="field">
        <label for="fPoints">主に使うツボ<span class="opt">「、」で区切る</span></label>
        <input id="fPoints" type="text" value="${esc(state.points)}">
      </div>
    </div>
    <div class="panel">
      <span class="eyebrow">患者さんに見せる内容</span>
      <div class="field">
        <label for="fGoal">鍼灸に通う目的</label>
        <textarea id="fGoal" rows="3">${esc(state.goal)}</textarea>
      </div>
      <div class="field">
        <label for="fPlain">施術の説明<span class="opt">専門用語を使わない言い方で</span></label>
        <textarea id="fPlain" rows="3">${esc(state.plain)}</textarea>
      </div>
      <div class="field">
        <label for="fFuture">その先に目指すからだ</label>
        <input id="fFuture" type="text" value="${esc(state.future)}">
      </div>
      <div class="field">
        <span class="label" id="paceLbl">通院のペース</span>
        <div class="chips" role="group" aria-labelledby="paceLbl">${one("pace", PACE)}</div>
      </div>
      <div class="field">
        <span class="label" id="termLbl">通う期間</span>
        <div class="chips" role="group" aria-labelledby="termLbl">${one("term", TERM)}</div>
      </div>
      <div class="field">
        <label for="fTermNote">期間についての説明</label>
        <textarea id="fTermNote" rows="2">${esc(state.termNote)}</textarea>
      </div>
      <div class="field">
        <label for="fComment">患者さんへのひとこと<span class="opt">任意</span></label>
        <textarea id="fComment" rows="3" placeholder="例：まずは肩の重さを軽くして、そのあと眠りも一緒に整えていきましょう。">${esc(state.comment)}</textarea>
      </div>
    </div>
  </div>`;
}

function meterHTML(l, r, lc, rc, v) {
  const left = Math.max(5, Math.min(95, 50 + v * 45));
  return `<div class="meter">
    <div class="ends"><span>${l}</span><span class="mid">ちょうどよい</span><span>${r}</span></div>
    <div class="mtrack" style="--l: var(--${lc}); --r: var(--${rc})"><span class="dot" style="left:${left.toFixed(1)}%"></span></div>
  </div>`;
}

function resultHTML() {
  const m = state.main && TYPES[state.main], s = state.sub && TYPES[state.sub];
  const a = axes();
  const syms = symList();
  const causeGroups = CAUSES.filter((g) => g.items.some(([t]) => state.causes.has(t)));

  const purpose = `<div class="panel">
      <span class="eyebrow">鍼灸に通う目的</span>
      ${syms.length ? `<div class="tags">${syms.map((n, i) => `<span class="${i === 0 ? "top" : ""}">${esc(n)}</span>`).join("")}</div>` : ""}
      ${state.goal ? `<p class="goal pre">${esc(state.goal)}</p>` : ""}
    </div>`;

  const stateBlock = m ? `<div class="sho-card" style="--tc: var(--${state.main})">
      <span class="role">あなたは今、こんなからだの状態です</span>
      <span class="term">${esc(m.nick)}</span>
      <span class="yomi">東洋医学では「${esc(termFull(m))}」といいます</span>
      <p>${esc(m.state)}</p>
      <p class="strength"><b>あなたの強み</b>　${esc(m.strength)}</p>
      ${s ? `<div class="sub-line" style="--tc: var(--${state.sub})"><span class="tag">あわせて見られる傾向</span><span class="t">${esc(s.nick)}</span><span class="small">${esc(s.state.split("。")[0])}。</span></div>` : ""}
    </div>` : `<div class="panel"><span class="eyebrow">今のからだの状態</span><p>今回の確認では、大きな偏りは見られませんでした。今のよい状態を保てるよう、からだ全体のバランスを整えていきましょう。</p></div>`;

  const balance = a.any ? `<div class="panel">
      <span class="eyebrow">からだのバランス</span>
      <div class="meters">
        ${meterHTML("冷えやすい", "熱がこもりやすい", "B", "H", a.x)}
        ${meterHTML("エネルギーが足りない", "巡りが滞りやすい", "A", "E", a.y)}
      </div>
      <p class="small">●の位置が真ん中に近いほど、バランスがとれている状態です。</p>
    </div>` : "";

  const causeBlock = causeGroups.length ? `<div class="panel">
      <span class="eyebrow">体調をくずしやすいきっかけ</span>
      ${causeGroups.map((g) => `<div class="field">
        <span class="label">${esc(g.label)}：${esc(g.items.filter(([t]) => state.causes.has(t)).map(([t]) => t).join("、"))}</span>
        <p>${esc(g.tip)}</p></div>`).join("")}
    </div>` : "";

  const adv = (h, color, items) => `<div class="adv" style="--hc: var(--${color})"><span class="h">${h}</span><ul>${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul></div>`;
  const adviceBlock = m ? `<div class="panel">
      <span class="eyebrow">暮らしのアドバイス</span>
      <div class="advice">
        ${adv("おすすめの食材", state.main, m.food)}
        ${adv("おすすめの過ごし方", state.main, m.living)}
        ${adv("控えめにしたいこと", state.main, m.less)}
      </div>
      ${s ? `<p class="small">あわせて見られる「${esc(s.nick)}」の傾向には、${esc(s.food.slice(0, 2).join("、"))}などもおすすめです。</p>` : ""}
      <p class="comment">${esc(m.mind)}</p>
    </div>` : "";

  const headache = ["頭痛", "めまい", "耳鳴り"].some((n) => state.syms.has(n));
  return `<div class="stack">
    <div class="result-head">
      <span class="eyebrow">${esc(state.date)}${state.name ? `　${esc(state.name)} 様` : ""}</span>
      <h2>体調確認の結果と、これからのこと</h2>
    </div>
    ${purpose}
    ${stateBlock}
    ${balance}
    ${causeBlock}
    <div class="panel">
      <span class="eyebrow">これからの施術</span>
      ${state.plain ? `<p class="pre">${esc(state.plain)}</p>` : ""}
      ${state.comment ? `<p class="comment pre">${esc(state.comment)}</p>` : ""}
      <div class="plan-grid">
        <div class="plan-item"><span class="k">通院のペース</span><span class="v">${esc(state.pace)}</span></div>
        <div class="plan-item"><span class="k">通う期間</span><span class="v">${esc(state.term)}</span></div>
      </div>
      ${state.termNote ? `<p>${esc(state.termNote)}</p>` : ""}
    </div>
    <div class="panel">
      <span class="eyebrow">通院の流れ</span>
      <div class="stages">${STAGES.map((st) => `<div class="stage"><span class="when">${st.when}</span><b>${st.name}</b><p>${st.text}</p></div>`).join("")}</div>
      ${state.future ? `<div class="future"><span class="eyebrow">その先に目指すからだ</span><span class="v">${esc(state.future)}</span></div>` : ""}
    </div>
    ${adviceBlock}
    <div class="believe">
      <p>からだは、ゆっくり変わっていきます。</p>
      <p>長いあいだかけてできた不調は、少しずつほどけていきます。よくなったり、ゆらいだりをくり返しながら、からだは前に進んでいます。</p>
      <p>つらいときは、ひとりでがんばらなくて大丈夫です。</p>
      <p class="last">楽に過ごせる毎日に向かって、一緒に進んでいきましょう。</p>
    </div>
    <p class="notice">施術のあとに、だるさや眠気が出ることがあります。多くは一時的なものですが、気になることがあれば遠慮なくお知らせください。当日は水分をとって、ゆっくり過ごしましょう。</p>
    ${pregnant() ? `<p class="notice">妊娠中の方へ：時期に合わせて、施術の内容や刺激をやさしく調整します。ご自宅でのツボ押しやお灸は、施術者に相談してからにしましょう。</p>` : ""}
    ${state.med === "あり" ? `<p class="notice">通院中・服薬中の方へ：ご自宅でのセルフケアを始める前に、主治医にもご相談ください。</p>` : ""}
    ${headache ? `<p class="notice">急に起きた激しい頭痛やめまい、手足のしびれ、ろれつが回らないなどの症状があるときは、すぐに医療機関を受診してください。</p>` : ""}
    <p class="small">この確認表は病気の診断ではなく、東洋医学の考え方でからだの傾向を知るためのものです。からだの変化には個人差があります。体調に不安がある場合や治療中の方は、医師・専門家にご相談ください。</p>
    <div class="panel no-print">
      <span class="eyebrow">患者さんにお渡しする</span>
      <div class="out-row">
        ${canPrint ? `<button class="btn primary" id="printBtn" type="button">結果を印刷・PDFに保存</button>` : ""}
        <button class="btn" id="copyPatientBtn" type="button">患者さん用の結果をコピー</button>
        <span class="copied" id="copiedPatient" hidden>コピーしました</span>
      </div>
      <p class="small">${canPrint ? "印刷画面で「PDFに保存」を選ぶと、患者さんにお渡しできるファイルになります。" : "印刷ボタンは、GitHub Pages などに置いたページで表示されます。"}コピーした文章は、メールや LINE に貼り付けて送れます。施術者用まとめは、印刷やコピーには含まれません。</p>
      <pre id="patientPre" class="staff-pre" hidden></pre>
    </div>
    <details class="panel staff">
      <summary>施術者用まとめ（カルテ転記用）</summary>
      <pre id="summary">${esc(summaryText())}</pre>
      <div class="copy-row">
        <button class="btn" id="copyBtn" type="button">まとめをコピー</button>
        <span class="copied" id="copied" hidden>コピーしました</span>
      </div>
    </details>
  </div>`;
}

// claude.ai の中（枠の中）では印刷できないので、単独のページとして開いたときだけ印刷ボタンを出す
const canPrint = (() => { try { return window.self === window.top; } catch (e) { return false; } })();

function patientText() {
  const m = state.main && TYPES[state.main], s = state.sub && TYPES[state.sub];
  const L = [];
  L.push(`鍼灸体調確認の結果（${state.date}）${state.name ? `　${state.name} 様` : ""}`);
  L.push("");
  L.push("■ 鍼灸に通う目的");
  if (state.syms.size) L.push(`気になる症状：${symList().join("、")}`);
  if (state.goal) L.push(state.goal);
  L.push("");
  if (m) {
    L.push(`■ 今のからだの状態：${m.nick}（東洋医学では「${termFull(m)}」）`);
    L.push(m.state);
    L.push(`あなたの強み：${m.strength}`);
    if (s) L.push(`あわせて見られる傾向：${s.nick}`);
  } else {
    L.push("■ 今のからだの状態：大きな偏りは見られませんでした。");
  }
  const groups = CAUSES.filter((g) => g.items.some(([t]) => state.causes.has(t)));
  if (groups.length) {
    L.push("");
    L.push("■ 体調をくずしやすいきっかけ");
    groups.forEach((g) => L.push(`${g.label}：${g.tip}`));
  }
  L.push("");
  L.push("■ これからの施術");
  if (state.plain) L.push(state.plain);
  if (state.comment) L.push(state.comment);
  L.push(`通院のペース：${state.pace}　通う期間：${state.term}`);
  if (state.termNote) L.push(state.termNote);
  L.push(`通院の流れ：${STAGES.map((st) => st.name).join(" → ")}`);
  if (state.future) L.push(`その先に目指すからだ：${state.future}`);
  if (m) {
    L.push("");
    L.push("■ 暮らしのアドバイス");
    L.push(`おすすめの食材：${m.food.join("、")}`);
    L.push(`おすすめの過ごし方：${m.living.join("、")}`);
    L.push(`控えめにしたいこと：${m.less.join("、")}`);
    L.push(m.mind);
  }
  L.push("");
  L.push("からだは、ゆっくり変わっていきます。楽に過ごせる毎日に向かって、一緒に進んでいきましょう。");
  L.push("");
  L.push("※この確認表は病気の診断ではなく、東洋医学の考え方でからだの傾向を知るためのものです。体調に不安がある場合や治療中の方は、医師・専門家にご相談ください。");
  return L.join("\n");
}

function selectEl(el) {
  const r = document.createRange(); r.selectNodeContents(el);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}

function copyText(text, okId, onFail) {
  const done = () => { $(okId).hidden = false; setTimeout(() => ($(okId).hidden = true), 2000); };
  try { navigator.clipboard.writeText(text).then(done, onFail); } catch (e) { onFail(); }
}

function summaryText() {
  const { cs } = judge();
  const a = axes();
  const m = state.main && TYPES[state.main], s = state.sub && TYPES[state.sub];
  const health = [...state.health];
  const lines = [];
  lines.push(`【鍼灸体調確認表】${state.date || "日付未入力"}`);
  lines.push(`氏名：${state.name || "（未記入）"}　年齢：${state.age || "（未記入）"}　鍼灸：${state.exp || "―"}　月経：${state.mens || "―"}`);
  lines.push(`既往・注意：${health.length ? health.join("、") : "なし"}　通院・服薬：${state.med || "―"}${state.medNote ? `（${state.medNote}）` : ""}`);
  const w = [...state.worry].filter((t) => t !== "特になし");
  if (w.length) lines.push(`心配なこと：${w.join("、")}`);
  lines.push(`主訴：${state.syms.size ? symList().join("、") : "（未選択）"}　いつから：${state.since || "―"}　つらさ：${state.level || "―"}`);
  if (state.symNote) lines.push(`主訴メモ：${state.symNote.replace(/\n/g, " ")}`);
  lines.push(`集計：${cs.map((c) => `${c.term}${c.n}`).join(" / ")}（各${QPER}問）`);
  lines.push(`八綱：${lean(a.kyo, a.jitsu, "虚", "実")}（虚${pct(a.kyo)}・実${pct(a.jitsu)}）／${lean(a.cold, a.heat, "寒", "熱")}（寒${pct(a.cold)}・熱${pct(a.heat)}）／陰陽：${lean(a.yin, a.yang, "陰", "陽")}`);
  const causes = causeStaffText();
  lines.push(`病因：${causes.length ? causes.join("　") : "（選択なし）"}`);
  lines.push(`メインの証：${m ? termFull(m) : "なし"}　サブの証：${s ? termFull(s) : "なし"}`);
  lines.push(`施術方針：${state.policy.replace(/\n/g, " ")}`);
  lines.push(`ツボ：${state.points}`);
  lines.push(`目的：${state.goal.replace(/\n/g, " ")}`);
  lines.push(`通院：${state.pace}　通う期間：${state.term}`);
  if (state.comment) lines.push(`ひとこと：${state.comment.replace(/\n/g, " ")}`);
  lines.push("");
  lines.push("該当項目：");
  KEYS.forEach((k) => {
    const hit = [];
    SECTIONS.forEach((sec, i) => sec.qs.forEach((q, j) => { if (q.k === k && state.checks.has(`${i}-${j}`)) hit.push(q.t); }));
    if (hit.length) lines.push(`${TYPES[k].term}）${hit.join("／")}`);
  });
  return lines.join("\n");
}

function bind() {
  const on = (id, key) => { const el = $(id); if (el) el.oninput = () => (state[key] = el.value); };
  on("fName", "name"); on("fDate", "date"); on("fAge", "age"); on("fMedNote", "medNote"); on("fSymNote", "symNote");
  on("fPolicy", "policy"); on("fPoints", "points"); on("fPlain", "plain"); on("fGoal", "goal"); on("fFuture", "future");
  on("fTermNote", "termNote"); on("fComment", "comment");
  document.querySelectorAll("[data-one]").forEach((b) => (b.onclick = () => {
    const f = b.dataset.one, v = b.dataset.v;
    state[f] = state[f] === v && step < STAFF_STEP ? "" : v;
    render(true);
  }));
  document.querySelectorAll("[data-many]").forEach((b) => (b.onclick = () => {
    const set = state[b.dataset.many], v = b.dataset.v;
    set.has(v) ? set.delete(v) : set.add(v);
    // 「特になし」は他の選択と同時に選ばない
    if (b.dataset.many === "worry") v === "特になし" ? [...set].forEach((t) => t !== v && set.delete(t)) : set.delete("特になし");
    if (b.dataset.many === "syms") {
      if (!set.has(state.top)) state.top = "";
      if (!state.top && set.size) state.top = [...set][0];
    }
    render(true);
  }));
  document.querySelectorAll("[data-cause]").forEach((b) => (b.onclick = () => {
    const t = b.dataset.cause;
    state.causes.has(t) ? state.causes.delete(t) : state.causes.add(t);
    b.setAttribute("aria-pressed", state.causes.has(t));
  }));
  document.querySelectorAll(".q").forEach((b) => (b.onclick = () => {
    const id = b.dataset.q;
    state.checks.has(id) ? state.checks.delete(id) : state.checks.add(id);
    b.setAttribute("aria-pressed", state.checks.has(id));
    const i = step - Q0;
    $("countNote").textContent = `当てはまる：${SECTIONS[i].qs.filter((_, j) => state.checks.has(`${i}-${j}`)).length} / ${SECTIONS[i].qs.length}`;
  }));
  document.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = () => {
    state[b.dataset.pick] = b.dataset.key || null;
    if (state.sub === state.main) state.sub = null;
    fillPlan(); render(true);
  }));
  const c = $("copyBtn");
  if (c) c.onclick = () => copyText(summaryText(), "copied", () => selectEl($("summary")));
  const cp = $("copyPatientBtn");
  if (cp) cp.onclick = () => {
    // コピーできない環境では文章を表示して、手で選んでもらう
    const pre = $("patientPre");
    pre.textContent = patientText();
    copyText(pre.textContent, "copiedPatient", () => { pre.hidden = false; selectEl(pre); });
  };
  const pb = $("printBtn");
  if (pb) pb.onclick = () => window.print();
}

$("nextBtn").onclick = () => {
  if (step === RESULT_STEP) { $("confirm").hidden = false; $("cancelReset").focus(); return; }
  if (step === CAUSE_STEP) autoPick();
  step++; render();
};
$("backBtn").onclick = () => { if (step > 0) { step--; render(); } };
$("cancelReset").onclick = () => { $("confirm").hidden = true; };
$("doReset").onclick = () => { $("confirm").hidden = true; fresh(); render(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("confirm").hidden = true; });

render();
</script>
</body>
</html>
